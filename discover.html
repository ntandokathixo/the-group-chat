<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Discover reality television shows by genre, rating and year."
    />
    <title>Discover Reality TV | The Group Chat</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>

  <body>
    <header class="site-header">
      <div class="navigation-container">
        <a class="site-logo" href="index.html">THE GROUP CHAT</a>

        <nav class="desktop-navigation" aria-label="Main navigation">
          <a href="index.html">Home</a>
          <a class="active" href="discover.html" aria-current="page">Discover</a>
          <a href="my-list.html">My List</a>
          <a href="about.html">About</a>
        </nav>

        <span class="profile-mark" aria-hidden="true"><span></span></span>

        <button
          class="mobile-menu-button"
          id="mobile-menu-button"
          type="button"
          aria-label="Open navigation menu"
          aria-expanded="false"
          aria-controls="mobile-navigation"
        >
          <span></span><span></span><span></span>
        </button>
      </div>

      <nav
        class="mobile-navigation"
        id="mobile-navigation"
        aria-label="Mobile navigation"
        hidden
      >
        <a href="index.html">Home</a>
        <a class="active" href="discover.html" aria-current="page">Discover</a>
        <a href="my-list.html">My List</a>
        <a href="about.html">About</a>
      </nav>
    </header>

    <main class="discover-page">
      <section class="discover-hero">
        <div class="discover-decoration discover-decoration-left" aria-hidden="true">
          <span>reality only</span>
        </div>

        <div class="discover-heading">
          <h1>Discover your next <span>obsession.</span></h1>
          <p class="discover-handwritten-note">friendships, feuds &amp; fabulousness</p>
        </div>

        <div class="discover-decoration discover-decoration-right" aria-hidden="true">
          <span>say less...</span>
        </div>
      </section>

      <section class="discover-controls" aria-labelledby="discover-filter-heading">
        <h2 id="discover-filter-heading" class="visually-hidden">
          Search and filter reality shows
        </h2>

        <form class="discover-search-form" id="discover-search-form" role="search">
          <span class="discover-search-icon" aria-hidden="true"></span>
          <label class="visually-hidden" for="discover-search">Search reality shows</label>
          <input
            id="discover-search"
            name="search"
            type="search"
            placeholder="Search reality shows..."
            autocomplete="off"
          />
          <button type="submit">Search</button>
        </form>

        <div class="discover-filter-row">
          <div class="filter-field">
            <label class="visually-hidden" for="genre-filter">Genre</label>
            <select id="genre-filter">
              <option value="">Any Genre</option>
              <option value="18">Drama</option>
              <option value="35">Comedy</option>
              <option value="99">Documentary</option>
              <option value="10751">Family</option>
              <option value="9648">Mystery</option>
            </select>
          </div>

          <div class="filter-field">
            <label class="visually-hidden" for="rating-filter">Rating</label>
            <select id="rating-filter">
              <option value="">Any Rating</option>
              <option value="8">8+ user score</option>
              <option value="7">7+ user score</option>
              <option value="6">6+ user score</option>
            </select>
          </div>

          <div class="filter-field">
            <label class="visually-hidden" for="year-filter">First air year</label>
            <select id="year-filter">
              <option value="">Any Year</option>
              <option value="2020-2026">2020–2026</option>
              <option value="2010-2019">2010–2019</option>
              <option value="2000-2009">2000–2009</option>
              <option value="1900-1999">Before 2000</option>
            </select>
          </div>
        </div>

        <div class="active-filters-row">
          <span>Active Filters:</span>
          <div class="active-filters-list" id="active-filters-list"></div>
          <button class="clear-filters-button" id="clear-filters" type="button" hidden>
            Clear all
          </button>
        </div>
      </section>

      <section class="discover-results" aria-labelledby="discover-result-title">
        <div class="discover-results-heading">
          <h2 id="discover-result-title">All Reality TV</h2>
          <p id="discover-result-count" role="status">Loading shows...</p>
        </div>

        <div class="show-grid discover-show-grid" id="discover-grid"></div>

        <div
          class="discover-pagination"
          id="discover-pagination"
          role="group"
          aria-label="Discover result pages"
          hidden
        >
          <button id="previous-page" type="button">← Previous</button>
          <span id="page-number">Page 1</span>
          <button id="next-page" type="button">Next →</button>
        </div>
      </section>
    </main>

    <footer class="site-footer"><p>THE GROUP CHAT</p></footer>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/ScrollTrigger.min.js"></script>
    <script src="js/api.js"></script>
    <script src="js/main.js"></script>
    <script src="js/discover.js"></script>
  </body>
</html>
